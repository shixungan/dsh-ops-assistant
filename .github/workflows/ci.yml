name: Build, test and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed client bundle
        run: git diff --exit-code -- lib/client.js

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installation archive
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
      - name: Publish new version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^\d+\.\d+\.\d+$/.test(pkg.version)) {
              throw new Error('Automatic releases require an x.y.z version');
            }
            const tag = `v${pkg.version}`;
            const repo = context.repo;
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              core.info(`${tag} already exists; leaving it unchanged.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            // Refuse to move an existing tag, even if it has no published release.
            try {
              await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
              throw new Error(`${tag} already exists without a release; inspect it manually.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const filename = `${pkg.name}-${pkg.version}.tgz`;
            const archive = fs.readFileSync(`dist/${filename}`);
            const digest = crypto.createHash('sha256').update(archive).digest('hex');
            const checksum = Buffer.from(`${digest}  ${filename}\n`);
            fs.writeFileSync('dist/SHA256SUMS.txt', checksum);
            // Keep incomplete uploads in a draft, not a publicly downloadable release.
            const { data: release } = await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `${pkg.name} ${tag}`,
              body: fs.readFileSync('CHANGELOG.md', 'utf8') +
                '\n\n安装方法见仓库 README。下载 .tgz 和 SHA256SUMS.txt 后，可执行 `sha256sum -c SHA256SUMS.txt` 校验。',
              draft: true,
              prerelease: pkg.version.startsWith('0.')
            });
            for (const [name, data] of [[filename, archive], ['SHA256SUMS.txt', checksum]]) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length }
              });
            }
            await github.rest.repos.updateRelease({ ...repo, release_id: release.id, draft: false });
            core.info(`Published ${tag} from ${context.sha}`);
